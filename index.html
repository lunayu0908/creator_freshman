<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWAG 新主播手冊</title>
<style>
  :root{
    --bg:#0c0c10;
    --surface:#1a1a20;
    --surface-hi:#232330;
    --border:#2c2c38;
    --text:#f2f2f4;
    --text-dim:#a3a3b0;
    --c1:#00D2BE; /* teal */
    --c2:#f6418d; /* pink */
    --c3:#FFD100; /* gold */
    --c4:#9b6bff; /* purple */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .bg-decor{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(480px 320px at 12% -6%, rgba(0,210,190,0.16), transparent 60%),
      radial-gradient(420px 300px at 92% 8%, rgba(246,65,141,0.14), transparent 60%),
      radial-gradient(500px 380px at 50% 100%, rgba(155,107,255,0.10), transparent 60%);
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:480px;
    margin:0 auto;
    padding:30px 18px 48px;
  }
  header{
    margin-bottom:24px;
    position:relative;
  }
  header .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    color:#0c0c10;
    background:linear-gradient(90deg, var(--c1), var(--c4));
    border-radius:999px;
    padding:5px 13px;
    margin-bottom:12px;
  }
  header h1{
    font-size:23px;
    font-weight:900;
    margin:0 0 8px;
    letter-spacing:.02em;
    background:linear-gradient(90deg,#fff,#cfeae7);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    font-size:13px;
    color:var(--text-dim);
    margin:0;
    line-height:1.6;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:22px;
  }
  .card{
    position:relative;
    background:linear-gradient(160deg, var(--surface-hi), var(--surface));
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px 14px 15px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:108px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .15s ease;
    -webkit-appearance:none;
    appearance:none;
    color:inherit;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:3px;
    background:var(--accent);
    opacity:.9;
  }
  .card:active{ transform:scale(0.96); }
  .card:hover{ border-color:var(--accent); box-shadow:0 8px 24px -8px var(--accent); }
  .card .badge{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    background:color-mix(in srgb, var(--accent) 22%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .card .title{
    font-size:14px;
    font-weight:700;
    line-height:1.4;
    white-space:pre-line;
  }
  .card .dot{
    position:absolute;
    top:13px;
    right:13px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--c2);
    box-shadow:0 0 8px var(--c2);
  }
  .card.viewed .dot{ display:none; }

  .card.external{
    background:linear-gradient(160deg, rgba(255,209,0,0.14), rgba(246,65,141,0.10));
  }

  footer{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  footer .link-btn{
    display:flex;
    align-items:center;
    gap:11px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px 15px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
  }
  footer .link-btn span.ico{
    font-size:17px;
    width:32px;height:32px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.06);
    flex-shrink:0;
  }
  footer .link-btn .sub{ color:var(--text-dim); font-size:11px; display:block; margin-top:2px; }

  /* modal */
  .modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(2px);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:linear-gradient(180deg, var(--surface-hi), var(--surface));
    width:100%;
    max-width:440px;
    max-height:82vh;
    border-radius:22px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    animation:popIn .22s cubic-bezier(.34,1.56,.64,1);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    box-shadow:0 20px 60px -12px rgba(0,0,0,0.6);
  }
  @keyframes popIn{
    from{ transform:scale(0.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .modal.closing{ animation:popOut .15s ease-in forwards; }
  @keyframes popOut{
    from{ transform:scale(1); opacity:1; }
    to{ transform:scale(0.9); opacity:0; }
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 12px;
    flex-shrink:0;
  }
  .modal-head .h-left{
    display:flex;
    align-items:center;
    gap:11px;
  }
  .modal-head .badge{
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    background:color-mix(in srgb, var(--accent) 25%, transparent);
    flex-shrink:0;
  }
  .modal-head h2{
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .modal-head button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:20px;
    cursor:pointer;
    padding:4px 8px;
    line-height:1;
  }

  .page-label{
    padding:0 18px 10px;
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:.04em;
  }

  .modal-body{
    padding:2px 18px 16px;
    overflow-y:auto;
    font-size:14.5px;
    line-height:1.85;
    color:#e4e4e6;
    flex:1;
  }
  .modal-body ul{
    margin:0 0 4px;
    padding-left:18px;
  }
  .modal-body li{ margin-bottom:7px; }
  .modal-body p{ margin:0 0 10px; }
  .tip, .warn, .example{
    border-radius:12px;
    padding:11px 13px;
    font-size:13px;
    margin:10px 0 2px;
  }
  .tip{ background:rgba(0,210,190,0.10); border:1px solid rgba(0,210,190,0.3); color:#d7f7f3; }
  .warn{ background:rgba(246,65,141,0.10); border:1px solid rgba(246,65,141,0.32); color:#ffd6e6; }
  .example{ background:rgba(255,209,0,0.08); border:1px solid rgba(255,209,0,0.3); color:#fff3c4; }
  .modal-body strong{ color:#fff; }

  /* chart components */
  .compare-cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:8px 0 14px;
  }
  .compare-cols .col{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
  }
  .compare-cols .col b{
    display:block;
    color:var(--accent);
    font-size:13px;
    margin-bottom:6px;
  }
  .compare-cols .col ul{ padding-left:16px; margin:0; font-size:12.5px; }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:8px 0 14px;
  }
  .chip{
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 12px;
    font-size:12.5px;
  }
  .chip.danger{ background:rgba(246,65,141,0.12); border-color:rgba(246,65,141,0.4); color:#ffc4dc; }

  .step-chips{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    margin:8px 0 14px;
  }
  .step-chips .step{
    background:color-mix(in srgb, var(--accent) 16%, var(--surface));
    border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius:10px;
    padding:7px 11px;
    font-size:12.5px;
    font-weight:700;
    white-space:nowrap;
  }
  .step-chips .arrow{ color:var(--text-dim); font-size:13px; }

  .range-bar{ margin:10px 0 16px; }
  .range-bar .cap{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .range-bar .track{
    height:10px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .range-bar .fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--c1), var(--c2));
  }
  .range-bar .labels{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-dim);
    margin-top:6px;
  }

  .mini-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 6px;
    margin:8px 0 14px;
    font-size:13px;
  }
  .mini-table td{
    background:rgba(255,255,255,0.04);
    padding:9px 12px;
    border:1px solid var(--border);
  }
  .mini-table tr td:first-child{ border-radius:10px 0 0 10px; font-weight:700; color:var(--accent); border-right:none; }
  .mini-table tr td:last-child{ border-radius:0 10px 10px 0; border-left:none; }

  .issue-row{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .issue-row:last-child{ border-bottom:none; }
  .issue-row .ico{ font-size:17px; flex-shrink:0; margin-top:1px; }
  .issue-row .sym{ font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .issue-row .fix{ font-size:12.5px; color:var(--text-dim); line-height:1.6; }

  .severity-band{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    margin-bottom:10px;
  }
  .severity-band.red{ background:rgba(246,65,141,0.16); color:#ff8fb8; }
  .severity-band.yellow{ background:rgba(255,209,0,0.16); color:#ffe266; }
  .severity-band.green{ background:rgba(0,210,190,0.16); color:#5cf0e0; }
  .severity-band.black{ background:rgba(155,107,255,0.2); color:#c4a9ff; }

  /* pagination footer */
  .modal-nav{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    background:rgba(0,0,0,0.15);
  }
  .modal-nav button{
    border:1px solid var(--border);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    border-radius:10px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .modal-nav button:disabled{ opacity:.3; }
  .modal-nav button.primary{
    background:var(--accent);
    color:#0c0c10;
    border:none;
  }
  .dots{
    display:flex;
    gap:6px;
  }
  .dots span{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--border);
    cursor:pointer;
  }
  .dots span.active{ background:var(--accent); width:16px; border-radius:4px; }
</style>
</head>
<body>

<div class="bg-decor"></div>

<div class="wrap">
  <header>
    <span class="eyebrow">✦ SWAG 新主播手冊</span>
    <h1>想查什麼，點下面就對了</h1>
    <p>不用照順序看，遇到問題直接找對應的卡片，一頁一頁翻更好讀。</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <a class="link-btn" href="https://linktr.ee/beforestarting" target="_blank" rel="noopener">
      <span class="ico">📖</span>
      <span>
        主播幫助中心
        <span class="sub">完整平台規範與功能說明</span>
      </span>
    </a>
    <a class="link-btn" href="https://www.instagram.com/s.live_creator/" target="_blank" rel="noopener">
      <span class="ico">📸</span>
      <span>
        SWAG 創作者招募 Instagram
        <span class="sub">追蹤看更多創作者資訊</span>
      </span>
    </a>
  </footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalEl">
    <div class="modal-head">
      <div class="h-left">
        <span class="badge" id="modalIcon"></span>
        <h2 id="modalTitle"></h2>
      </div>
      <button id="modalClose" aria-label="關閉">✕</button>
    </div>
    <div class="page-label" id="pageLabel"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-nav">
      <button id="btnPrev">← 上一頁</button>
      <div class="dots" id="dots"></div>
      <button id="btnNext" class="primary">下一頁 →</button>
    </div>
  </div>
</div>

<script>
const COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];

const CARDS = [
  {
    id:"account", icon:"🪪", title:"帳號設定與驗證",
    pages:[
      { label:"帳號 vs 暱稱，別搞混", html:`
        <div class="compare-cols">
          <div class="col">
            <b>主播帳號</b>
            <ul><li>你的登入 ID</li><li>全站獨一無二</li><li>只能英文＋數字</li></ul>
          </div>
          <div class="col">
            <b>暱稱</b>
            <ul><li>粉絲看到的名字</li><li>可用中／日文，最多 10 字</li><li>每 30 天可改一次</li></ul>
          </div>
        </div>
        <p style="font-size:12.5px;color:var(--text-dim)">暱稱怎麼改都不影響登入，放心調整。</p>
      `},
      { label:"大頭貼怎麼選", html:`
        <ul>
          <li>用本人真實照片，不能盜圖、不能有路人入鏡</li>
          <li>背景乾淨（素色牆面最保險）、光線充足、畫質清楚</li>
          <li>自拍／棚拍都可以，露臉、有上妝會更容易被記住</li>
        </ul>
      `},
      { label:"暱稱不能出現這些", html:`
        <div class="chip-row">
          <span class="chip danger">仇恨歧視言論</span>
          <span class="chip danger">暴力恐嚇字眼</span>
          <span class="chip danger">冒充官方／他人</span>
          <span class="chip danger">廣告宣傳</span>
          <span class="chip danger">髒話／毒品／未成年</span>
          <span class="chip danger">電話地址等個資</span>
        </div>
        <div class="tip">💡 帳號審核通過後，記得盡快去填寫「收款資料表單」，越早填之後提現越不會卡到。</div>
      `}
    ]
  },
  {
    id:"profile", icon:"🎒", title:"個人頁面怎麼佈置",
    pages:[
      { label:"Hashtag 技巧", html:`
        <ul>
          <li>抓 4～10 個就好，太多版面會亂</li>
          <li>越短越有力，不要把整句文案當標籤用</li>
          <li>打造專屬標籤（ID、中文暱稱），方便鐵粉一鍵找到你</li>
          <li>同義詞也要顧：活動是 #聖誕啪，可以順手多加 #聖誕、#耶誕</li>
        </ul>
      `},
      { label:"個人標籤（最多 5 個）", html:`
        <p>用來標示你的內容特色，系統會依此把你配對給喜歡這類型的觀眾。</p>
        <div class="chip-row">
          <span class="chip">TAG 01</span><span class="chip">TAG 02</span><span class="chip">TAG 03</span><span class="chip">TAG 04</span><span class="chip">TAG 05</span>
        </div>
        <div class="tip">💡 要更改標籤，需要重新填寫官方表單。</div>
      `},
      { label:"自我介紹", html:`
        <p>寫得豐富一點，私訊、解鎖、進房的機率都會提高。可以包含：</p>
        <ul>
          <li>興趣特質、綽號／外號</li>
          <li>目前在辦的活動（送禮換片、約會等）</li>
          <li>一兩句能跟粉絲互動的小文案</li>
        </ul>
        <div class="example">範例：「氣質女神 Luna ✦ 喜歡貓咪與深夜聊天。本週送禮換片活動進行中🎁 私訊我，陪妳玩～」</div>
      `}
    ]
  },
  {
    id:"livesetup", icon:"📡", title:"直播設定怎麼選",
    pages:[
      { label:"開播前必選兩件事", html:`
        <p><strong>尺度標籤</strong>（必選）：露點／不露點，要誠實選，會影響誰看得到你的直播。</p>
        <div class="chip-row"><span class="chip">露點</span><span class="chip">不露點</span></div>
        <p><strong>內容標籤</strong>（1～5 個）：選對系統才會推給對的觀眾。</p>
        <div class="chip-row"><span class="chip">聊天</span><span class="chip">吃播</span><span class="chip">實戰</span><span class="chip">音樂</span></div>
      `},
      { label:"開播標題怎麼下", html:`
        <p>標題就像貼在門口的公告，決定路人要不要進來。</p>
        <div class="compare-cols">
          <div class="col"><b>✓ 好標題</b><p style="font-size:13px;margin:0">「今晚有你沒看過的我」</p></div>
          <div class="col"><b>✗ 無資訊標題</b><p style="font-size:13px;margin:0">「直播中」</p></div>
        </div>
        <div class="warn">⚠️ 標題要跟直播內容一致，觀眾發現「貨不對版」會馬上離開，影響口碑。</div>
      `},
      { label:"語音直播模式", html:`
        <p>不想露臉、只想用聲音陪伴粉絲，也能一鍵開播：</p>
        <div class="step-chips">
          <span class="step">開播設定</span><span class="arrow">→</span>
          <span class="step">選語音直播</span><span class="arrow">→</span>
          <span class="step">填標題／標籤</span><span class="arrow">→</span>
          <span class="step">儲存</span>
        </div>
        <p style="font-size:13px">同樣支援一對多、表演秀，收到一對一邀請也能直接接受。</p>
        <div class="warn">⚠️ 開播後無法中途切換直播類型，要換需先關播重開；目前僅手機 App 支援，OBS 尚不支援。</div>
      `}
    ]
  },
  {
    id:"liveroom", icon:"🕹️", title:"直播間功能操作",
    pages:[
      { label:"指令系統", html:`
        <p>粉絲花鑽石解鎖你設定的指令，例如脫某件衣服、做某個動作。</p>
        <div class="range-bar">
          <div class="cap">自訂單一指令價格</div>
          <div class="track"><div class="fill" style="width:100%"></div></div>
          <div class="labels"><span>100 鑽石</span><span>5,000 鑽石</span></div>
        </div>
        <p style="font-size:13px">最多可設 10 個指令，內容自己決定，隨時可以開關調整。</p>
        <div class="warn">⚠️ 指令一定要做得到，不然粉絲檢舉「未完成指令」，鑽石會被扣回退還。</div>
      `},
      { label:"超級留言", html:`
        <p>粉絲花鑽石發送的醒目留言，會置頂並附加特效，預設開啟。</p>
        <table class="mini-table">
          <tr><td>2,000 鑽石</td><td>置頂 3 秒</td></tr>

const grid = document.getElementById("grid");
const STORAGE_KEY = "swagHubViewed_v2";
let viewed = [];
try { viewed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { viewed = []; }

CARDS.forEach((c,i) => {
  const accent = COLORS[i % COLORS.length];
  const btn = document.createElement("button");
  btn.className = "card" + (viewed.includes(c.id) ? " viewed" : "");
  btn.dataset.id = c.id;
  btn.style.setProperty("--accent", accent);
  btn.innerHTML = `<span class="dot"></span><span class="badge">${c.icon}</span><span class="title">${c.title}</span>`;
  btn.addEventListener("click", () => openModal(c, accent));
  grid.appendChild(btn);
});

// 週報外連結卡片
const extAccent = COLORS[2];
const extBtn = document.createElement("a");
extBtn.className = "card external";
extBtn.href = "https://events.swag.app/2026_creator_weekly_insights/";
extBtn.target = "_blank";
extBtn.rel = "noopener";
extBtn.style.setProperty("--accent", extAccent);
extBtn.innerHTML = `<span class="badge">🏆</span><span class="title">本週排行榜\n看看誰是本週之星</span>`;
grid.appendChild(extBtn);

const backdrop = document.getElementById("modalBackdrop");
const modalEl = document.getElementById("modalEl");
const modalIcon = document.getElementById("modalIcon");
const modalTitle = document.getElementById("modalTitle");
const pageLabel = document.getElementById("pageLabel");
const modalBody = document.getElementById("modalBody");
const modalClose = document.getElementById("modalClose");
const btnPrev = document.getElementById("btnPrev");
const btnNext = document.getElementById("btnNext");
const dotsEl = document.getElementById("dots");

let currentCard = null;
let currentPage = 0;

function openModal(c, accent){
  currentCard = c;
  currentPage = 0;
  modalEl.style.setProperty("--accent", accent);
  modalIcon.textContent = c.icon;
  modalTitle.textContent = c.title;

  dotsEl.innerHTML = "";
  c.pages.forEach((p, idx) => {
    const d = document.createElement("span");
    d.addEventListener("click", () => { currentPage = idx; renderPage(); });
    dotsEl.appendChild(d);
  });

  renderPage();
  backdrop.classList.add("open");
  document.body.style.overflow = "hidden";

  if(!viewed.includes(c.id)){
    viewed.push(c.id);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(viewed)); } catch(e) {}
    const cardEl = grid.querySelector('.card[data-id="'+c.id+'"]');
    if(cardEl) cardEl.classList.add("viewed");
  }
}

function renderPage(){
  const total = currentCard.pages.length;
  const page = currentCard.pages[currentPage];
  pageLabel.textContent = page.label;
  modalBody.innerHTML = page.html;
  modalBody.scrollTop = 0;

  [...dotsEl.children].forEach((d, idx) => d.classList.toggle("active", idx === currentPage));

  btnPrev.disabled = currentPage === 0;
  if(currentPage === total - 1){
    btnNext.textContent = "完成 ✓";
  } else {
    btnNext.textContent = "下一頁 →";
  }
}

btnPrev.addEventListener("click", () => {
  if(currentPage > 0){ currentPage--; renderPage(); }
});
btnNext.addEventListener("click", () => {
  const total = currentCard.pages.length;
  if(currentPage < total - 1){ currentPage++; renderPage(); }
  else { closeModal(); }
});

function closeModal(){
  modalEl.classList.add("closing");
  setTimeout(() => {
    backdrop.classList.remove("open");
    modalEl.classList.remove("closing");
    document.body.style.overflow = "";
  }, 150);
}
modalClose.addEventListener("click", closeModal);
backdrop.addEventListener("click", (e) => { if(e.target === backdrop) closeModal(); });

// swipe support
let touchStartX = 0;
modalBody.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
modalBody.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) < 50) return;
  const total = currentCard.pages.length;
  if(dx < 0 && currentPage < total - 1){ currentPage++; renderPage(); }
  else if(dx > 0 && currentPage > 0){ currentPage--; renderPage(); }
}, {passive:true});
</script>
